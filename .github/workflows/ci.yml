name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both majors, because they disagree about dependency install scripts:
        # pnpm 10 only warns about an unapproved one, pnpm 11 turns it into a
        # hard error that also fails every `pnpm run`. Pinning one major hid it.
        pnpm: [10, 11]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fails if pnpm-lock.yaml is missing or stale. The lockfile is committed
      # on purpose: plugin supply chain is the user's risk, not ours to hide.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # The published surface must match what cordis.patch.yml and package.json
      # exports promise: every declared path has to exist after a build.
      - name: verify declared paths
        run: |
          set -eu
          for path in lib/index.js lib/tool.js lib/routes.js lib/invariant.js \
                      lib/types/index.d.ts cordis.patch.yml; do
            test -e "$path" || { echo "missing declared path: $path" >&2; exit 1; }
          done
          node -e "
            const pkg = require('./package.json')
            if (!pkg.dsh?.bundle?.patch) { console.error('package.json lost its dsh.bundle manifest'); process.exit(1) }
            const scripts = ['prepare','preinstall','install','postinstall']
            const found = scripts.filter(s => pkg.scripts?.[s])
            if (found.length) { console.error('install-time lifecycle script present: ' + found); process.exit(1) }
          "
